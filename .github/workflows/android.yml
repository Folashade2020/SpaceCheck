name: Android build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_URL: ${{ secrets.APP_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Sync Capacitor Android shell
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.APP_URL }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Sign release artifacts
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "No keystore secret - leaving release artifacts unsigned."
            exit 0
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo "$BT"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          # Unsigned release APKs carry an -unsigned suffix; resolve real names.
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          printenv KEYSTORE_PASSWORD > /tmp/kspass
          printenv KEY_PASSWORD > /tmp/kypass
          chmod 600 /tmp/kspass /tmp/kypass
          # APK: align + v2 sign with apksigner
          "$BT/zipalign" -f 4 "$APK" /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/release.keystore \
            --ks-pass file:/tmp/kspass --ks-key-alias "$KEY_ALIAS" \
            --key-pass file:/tmp/kypass --out "${APK%.apk}-signed.apk" /tmp/aligned.apk
          mv "${APK%.apk}-signed.apk" "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          # AAB: sign with jarsigner (apksigner is APK-only)
          "$JAVA_HOME/bin/jarsigner" -keystore /tmp/release.keystore \
            -storepass:file /tmp/kspass -keypass:file /tmp/kypass \
            -signedjar "${AAB%.aab}-signed.aab" "$AAB" "$KEY_ALIAS"
          mv "${AAB%.aab}-signed.aab" "$AAB"
          "$JAVA_HOME/bin/jarsigner" -verify "$AAB" | head -3
          rm -f /tmp/release.keystore /tmp/aligned.apk /tmp/kspass /tmp/kypass
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/SpaceCheck-debug.apk
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" dist/SpaceCheck-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/SpaceCheck-release.aab
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spacecheck-android
          path: dist/

      - name: Probe
        run: echo probe-ok

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: spacecheck-android
          path: dist

      - name: Create GitHub Release
        run: |
          TAG="android-v1.0.0-build-${{ github.run_number }}"
          gh release create "$TAG" dist/* \
            --title "SpaceCheck Android v1.0.0 (build ${{ github.run_number }})" \
            --notes "SpaceCheck Android release. Package: com.spacecheck.app, version 1.0.0 (1). Install SpaceCheck-release.apk directly on Android (allow unknown sources). SpaceCheck-release.aab is the Play Store bundle."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
