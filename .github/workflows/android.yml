name: Android build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_URL: ${{ secrets.APP_URL }}
  NODE_VERSION: "24"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Sync Capacitor Android shell
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.APP_URL }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Sign release artifacts
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo "$BT"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          for f in android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/bundle/release/app-release.aab; do
            "$BT/zipalign" -f 4 "$f" /tmp/aligned-out 2>/dev/null || cp "$f" /tmp/aligned-out
            # apksigner works for both APK and AAB (AAB signing supported since build-tools 30+)
            "$BT/apksigner" sign --ks /tmp/release.keystore \
              --ks-pass:env KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
              --key-pass:env KEY_PASSWORD --out "$f.signed" /tmp/aligned-out
            mv "$f.signed" "$f"
            if [ "${f##*.}" = "apk" ]; then "$BT/apksigner" verify --print-certs "$f" | head -3; fi
          done
          rm -f /tmp/release.keystore /tmp/aligned-out
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/SpaceCheck-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/SpaceCheck-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/SpaceCheck-release.aab
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spacecheck-android
          path: dist/
